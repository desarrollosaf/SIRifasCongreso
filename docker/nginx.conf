server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4g;

    # Canal en vivo de la pantalla pública (Server-Sent Events): sin búfer y sin cortar la conexión
    location /backend/api/sorteo/stream {
        proxy_pass http://backend:3018/api/sorteo/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # API del backend (mismo origen, sin problemas de CORS)
    location /backend/ {
        proxy_pass http://backend:3018/;
        proxy_request_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # index.html nunca se guarda en caché: así siempre se carga la versión más nueva
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
